name: Build & Publish Docker Images

on:
  workflow_run:
    workflows: ["Continuous Integration / Webservice"]
    types: [completed]
    branches:
      - main
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # For workflow_run: only publish when CI actually passed.
    # For tag pushes: always publish (CI does not run on tags).
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app-php
            dockerfile: webservice/build/frankenphp/Dockerfile
            context: webservice
            target: frankenphp_prod
          - image: worker-php
            dockerfile: webservice/build/worker/Dockerfile
            context: webservice
            target: worker_prod
          - image: worker-intelpage
            dockerfile: webservice/build/worker/Dockerfile
            context: webservice
            target: worker_intelpage_prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # For workflow_run: build the exact commit CI validated, not whatever
          # HEAD happens to be at publish time if a new push arrived in between.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/event-pager/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          platforms: linux/amd64
